<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Déclic</title>
<meta name="description" content="Activité, statistiques et conseil du jour du compte Le Déclic.">
<meta name="theme-color" content="#0E1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Déclic">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <img src="icons/icon-192.png" alt="" class="avatar" width="36" height="36">
  <div>
    <h1>Le Déclic</h1>
    <p class="maj" id="maj">Chargement…</p>
  </div>
  <button class="refresh" id="refresh" aria-label="Actualiser">↻</button>
</header>

<form id="verrou" class="verrou" hidden>
  <img src="icons/icon-192.png" alt="" width="72" height="72" class="avatar">
  <h2>Appli privée</h2>
  <label for="code">Entre ton code d'accès</label>
  <input id="code" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
  <p id="verrou-msg" class="verrou-msg"></p>
  <button type="submit">Ouvrir</button>
</form>

<main>
  <section id="tab-jour" class="tab actif" aria-labelledby="nav-jour">
    <article class="conseil" id="conseil"></article>
    <h2>En bref</h2>
    <div class="tuiles" id="tuiles"></div>
    <h2>Vues par jour sur Instagram</h2>
    <div class="carte" id="graph"></div>
    <h2>Prochaines publications</h2>
    <div id="prochains"></div>
  </section>

  <section id="tab-activite" class="tab" aria-labelledby="nav-activite">
    <h2>Programmé</h2>
    <div id="programmes"></div>
    <h2>Publié</h2>
    <div id="publies"></div>
  </section>

  <section id="tab-stats" class="tab" aria-labelledby="nav-stats">
    <div class="seg" role="tablist">
      <button class="actif" data-reseau="instagram">Instagram</button>
      <button data-reseau="tiktok">TikTok</button>
    </div>
    <div id="stats"></div>
  </section>
</main>

<nav class="nav">
  <button id="nav-jour" data-tab="jour" class="actif"><span>☀︎</span>Aujourd'hui</button>
  <button id="nav-activite" data-tab="activite"><span>☰</span>Activité</button>
  <button id="nav-stats" data-tab="stats"><span>▮▮</span>Stats</button>
</nav>

<script src="app.js"></script>
</body>
</html>
