<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NITT</title>
<meta name="description" content="Tableau de bord des comptes de NITT Corporation.">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NITT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/nitt-180.png">
<link rel="icon" type="image/png" href="icons/nitt-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600;700;800&family=Fredoka:wght@600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hub" class="hub">
  <div class="hub-voile" aria-hidden="true"></div>
  <header class="hub-tete">
    <p class="hub-logo">NITT</p>
    <p class="hub-sous">Corporation</p>
    <span class="hub-compteur" id="hub-compteur" aria-live="polite"></span>
  </header>
  <form id="verrou" class="verrou hub-verrou" hidden>
    <p class="hub-logo">NITT</p>
    <h2>Espace privé</h2>
    <label for="code">Entre ton code d'accès</label>
    <input id="code" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <p id="verrou-msg" class="verrou-msg"></p>
    <button type="submit">Ouvrir</button>
  </form>
  <div class="hub-corps">
    <div id="hub-liste" class="carrousel" tabindex="0" role="region" aria-roledescription="carrousel" aria-label="Comptes NITT, glisse à gauche ou à droite"><p class="vide">Chargement…</p></div>
    <div class="hub-nav">
      <button class="hub-fl" id="hub-prec" aria-label="Compte précédent">←</button>
      <div class="points" id="hub-points" role="tablist" aria-label="Choisir un compte"></div>
      <button class="hub-fl" id="hub-suiv" aria-label="Compte suivant">→</button>
    </div>
    <p class="hub-pied" id="hub-pied"></p>
  </div>
</div>

<div id="app" class="app" hidden>
<header class="top">
  <button class="retour" id="retour" aria-label="Retour aux comptes NITT">‹</button>
  <img src="icons/icon-192.png" alt="" class="avatar" id="app-logo" width="36" height="36">
  <div>
    <h1 id="app-nom">Le Déclic</h1>
    <p class="maj" id="maj">Chargement…</p>
  </div>
  <button class="refresh" id="refresh" aria-label="Actualiser">↻</button>
</header>



<main>
  <div id="sans-donnees" class="vide-compte" hidden></div>
  <section id="tab-jour" class="tab actif" aria-labelledby="nav-jour">
    <article class="conseil" id="conseil"></article>
    <h2>En bref</h2>
    <div class="tuiles" id="tuiles"></div>
    <h2>Vues par jour sur Instagram</h2>
    <div class="carte" id="graph"></div>
    <h2>Prochaines publications</h2>
    <div id="prochains"></div>
    <p class="version">Version 11 de l'appli · NITT</p>
  </section>

  <section id="tab-activite" class="tab" aria-labelledby="nav-activite">
    <h2>Programmé</h2>
    <div id="programmes"></div>
    <h2>Publié</h2>
    <div id="publies"></div>
  </section>

  <section id="tab-dernier" class="tab" aria-labelledby="nav-dernier">
    <div id="dernier"></div>
  </section>

  <section id="tab-stats" class="tab" aria-labelledby="nav-stats">
    <div class="seg" role="tablist">
      <button class="actif" data-reseau="instagram">Instagram</button>
      <button data-reseau="tiktok">TikTok</button>
    </div>
    <div id="stats"></div>
  </section>
</main>

<nav class="nav">
  <button id="nav-jour" data-tab="jour" class="actif"><span>☀︎</span>Aujourd'hui</button>
  <button id="nav-activite" data-tab="activite"><span>☰</span>Activité</button>
  <button id="nav-dernier" data-tab="dernier"><span>★</span>Dernier post</button>
  <button id="nav-stats" data-tab="stats"><span>▮▮</span>Stats</button>
</nav>
</div>

<script src="app.js"></script>
</body>
</html>
